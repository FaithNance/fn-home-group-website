[build]
  publish = "."
  command = ""

# Epique Edge page URL was changed from /epique-edge.html to /epiqueedge.html
# (dashes removed). Redirect the old address so any existing links, bookmarks,
# or search results don't break.
[[redirects]]
  from = "/epique-edge.html"
  to = "/epiqueedge.html"
  status = 301
  force = true

# Site-wide dash removal: every page URL that used to contain a hyphen was
# renamed to a dash-free equivalent. These redirects keep old links,
# bookmarks, and search results working.
