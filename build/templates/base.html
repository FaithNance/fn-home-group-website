<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://www.fnhomegroup.com/assets/logos/fnhomegrouplogo.png">
<meta property="og:site_name" content="FN Home Group">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">

<!-- Favicons (generated from the FN Home Group logo; replace with a final custom favicon if desired) -->
<link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/appletouchicon.png">

<link rel="stylesheet" href="/assets/styles.css?v=20260801-2">
{{SCHEMA}}
</head>
<body class="{{BODY_CLASS}}">
{{NAV}}
<main id="maincontent">
{{CONTENT}}
</main>
{{FOOTER}}
</body>
</html>
